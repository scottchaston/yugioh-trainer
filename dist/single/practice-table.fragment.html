he difference and nothing is destroyed. If the opponent has no monsters you attack directly for full ATK.`},{title:`Spell Cards`,body:`Normal Spells are used during your Main Phase and go to the Graveyard after resolving. Continuous, Equip and Field Spells stay on the field. Quick-Play Spells can be activated from your hand during your turn, or from a Set position on any turn after the turn they were Set. Field Spells go in the Field Zone.`},{title:`Trap Cards`,body:`Traps must be Set first and cannot be activated during the turn they were Set. From the next turn on you can activate them at the right moment, even during your opponent's turn: for example when a monster attacks or is Summoned. Counter Traps are the fastest (Spell Speed 3).`},{title:`Spell Speed and chains`,body:`Spell Speed 1: Normal Spells and most monster effects; used only at a quiet moment in your own Main Phase and cannot respond to anything. Spell Speed 2: Quick-Play Spells, Traps and Quick Effects; can respond to other cards. Spell Speed 3: Counter Traps; only another Counter Trap can respond to them. When cards respond to each other they form a chain, which resolves backwards: the last card activated resolves first.`},{title:`Costs versus effects`,body:`A cost (text before a semicolon or the word "cost") is paid when you activate the card, even if the effect is later negated. The effect happens when the card resolves. "Target" means you choose the card when you activate; if that card is gone when the effect resolves, the effect does nothing.`},{title:`Crystal Beasts`,body:`When a face-up Crystal Beast is destroyed in a Monster Zone, its controller may place it in a Spell & Trap Zone as a Continuous Spell instead of sending it to the Graveyard. There it is not a monster (it cannot attack), but Crystal Beast support such as Ancient City - Rainbow Ruins, Crystal Beacon and Crystal Promise counts or uses it. The Field Zone is separate from the five Spell & Trap Zones.`},{title:`Pendulum Monsters`,body:`A Pendulum Monster can be placed in one of your two Pendulum Zones (the leftmost and rightmost Spell & Trap Zones), where it is treated as a Spell Card with its Pendulum Effect. With Scales in both zones, once per turn you can Pendulum Summon monsters whose Levels are strictly between the two Scales. Destroyed Pendulum Monsters go face-up to the Extra Deck.`},{title:`Xyz Monsters`,body:`An Xyz Monster (black frame; a Rank instead of a Level) is Xyz Summoned from the Extra Deck by stacking monsters you control whose Level equals its Rank (Traptrix Rafflesia: 2 Level 4 monsters). Those monsters do not go to the Graveyard: they become Xyz Materials attached under it (shown as ◉ on the card). Many Xyz effects cost "detach 1 material", which sends one attached card to the Graveyard. When the Xyz Monster leaves the field its materials go to the Graveyard. Xyz Monsters have no Level, so they cannot be used as Synchro Material.`},{title:`Link Monsters and Extra Monster Zones`,body:`A Link Monster (blue frame; a LINK rating and arrows instead of a Level and DEF) is Link Summoned from the Extra Deck by sending monsters from your field to the Graveyard, as many as its LINK rating (Traptrix Sera: LINK-1, one non-Link Traptrix monster). It is placed in one of the two shared Extra Monster Zones, or in a Main Monster Zone that one of your Link Monsters' arrows points to. Link Monsters have no DEF and are always in Attack Position. Some cards refer to a "column": the five vertical lines of zones running across both sides of the field (the Extra Monster Zones sit in the 2nd and 4th columns).`},{title:`Kaiju monsters`,body:`Kaiju (Gadarla, Kumongous) cannot be Normal Summoned. Instead you can Special Summon one from your hand to your OPPONENT'S side of the field by Tributing a monster they control: an unusual way to get rid of a big threat, at the price of giving your opponent a monster. If your opponent controls a Kaiju, you can Special Summon a Kaiju from your hand to your own field.`},{title:`Effects from the hand`,body:`A few monsters act while still in your hand: Battle Fader stops a direct attack, Ash Blossom negates a "search the Deck" effect, Retaliating "C" answers a Spell, and Evenly Matched can be activated from the hand when you control no cards at the end of the Battle Phase. These are Quick Effects (Spell Speed 2), so the table offers them during the other player's turn as RESPONSE AVAILABLE windows.`},{title:`Gemini Monsters`,body:`A Gemini monster (Darkstorm Dragon) is a Normal Monster with no effect on the field and in the Graveyard. While it is face-up you can use your Normal Summon on it again (no Tributes) to give it its effect.`}];function wl({onClose:e}){let[t,n]=(0,v.useState)(0);return(0,I.jsx)(`div`,{className:`modal-backdrop`,onClick:e,children:(0,I.jsxs)(`div`,{className:`modal help`,onClick:e=>e.stopPropagation(),children:[(0,I.jsxs)(`div`,{className:`modal-head`,children:[(0,I.jsx)(`h3`,{children:`Rules help`}),(0,I.jsx)(`button`,{className:`btn`,onClick:e,children:`Close`})]}),Cl.map((e,r)=>(0,I.jsxs)(`div`,{className:`help-item`,children:[(0,I.jsxs)(`button`,{className:`help-title`,onClick:()=>n(t===r?null:r),children:[t===r?`▾`:`▸`,` `,e.title]}),t===r&&(0,I.jsx)(`p`,{className:`help-body`,children:e.body})]},r))]})})}window.__ygoStore=ii;var Tl=[`DRAW`,`STANDBY`,`MAIN1`,`BATTLE`,`MAIN2`,`END`],El={DRAW:`Draw`,STANDBY:`Standby`,MAIN1:`Main 1`,BATTLE:`Battle`,MAIN2:`Main 2`,END:`End`},Dl={DRAW:`Draw Phase: the turn player draws 1 card (except the very first turn of the Duel).`,STANDBY:`Standby Phase: some card effects happen here. Usually nothing to do.`,MAIN1:`Main Phase 1: Normal Summon or Set one monster, Set Spells/Traps, activate Spells and effects, change battle positions.`,BATTLE:`Battle Phase: attack with face-up Attack Position monsters, one attack each. Your opponent can respond to attacks with Traps and Quick Effects.`,MAIN2:`Main Phase 2: like Main Phase 1 (you still only get one Normal Summon/Se
